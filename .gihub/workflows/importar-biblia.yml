name: Importar Biblia RV1909
'on':
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar y validar los 1189 capítulos
        run: python scripts/importar_biblia.py
      - name: Guardar páginas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add biblia/
          if ! git diff --cached --quiet; then
            git commit -m "Importar biblioteca Reina-Valera 1909"
            git push
          fi
